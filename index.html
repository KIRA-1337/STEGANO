<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Разрешаем inline скрипты и blob для максимальной совместимости -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
<meta name="theme-color" content="#080b12">
<title>Stegano v8 — LSB Стенография (Fixed)</title>

<style>
:root{ --bg:#070a10; --panel:#10151e; --line:#283241; --text:#f4f7fb; --muted:#929cab; --accent:#738cff; --ok:#5be293; --bad:#ff7280; --warn:#f4c95d; --shadow:0 18px 55px rgba(0,0,0,.34) }
*{box-sizing:border-box} html{background:var(--bg)} body{ margin:0; min-height:100svh; background: radial-gradient(80% 70% at 50% 0,#18233d 0,#0b0e15 35%,#070a10 70%); color:var(--text); font:15px/1.5 system-ui,sans-serif }
button,input,textarea,select{font:inherit} button{cursor:pointer} button:disabled{opacity:.4;cursor:not-allowed}
.app{ width:min(1180px,100%); margin:auto; padding: 20px; }
.top{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px }
.brand h1{ margin:0; font-size:clamp(30px,6vw,50px); line-height:1; letter-spacing:-1.8px }
.brand p{ margin:9px 0 0; color:var(--muted) }
.pill{ border:1px solid var(--line); background:#0e131b; border-radius:999px; padding:8px 12px; font-size:12px; color:#c0c9d7 }
.layout{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.card{ background:linear-gradient(180deg,rgba(18,23,32,.96),rgba(12,16,23,.97)); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow) }
.wide{grid-column:1/-1} .card h2{ margin:0 0 15px; font-size:19px }
.fileBox{ border:1px solid var(--line); background:#090d13; border-radius:14px; padding:13px; margin-top:10px }
.fileName{ overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:700 }
.fileInfo{ color:var(--muted); font-size:12px; margin-top:3px }
.drop{ border:1px dashed #3b4756; border-radius:14px; background:#0b0f16; padding:27px 14px; text-align:center; transition:.18s; cursor:pointer }
.drop.drag, .drop:hover{ border-color:var(--accent); background:#0f1625 }
.drop strong{display:block} .drop span{ display:block; color:var(--muted); font-size:12px; margin-top:4px }
input[type=file]{display:none}
label{ display:block; margin:14px 0 7px; color:#aeb8c8; font-size:12px }

textarea{ min-height:100px; resize:vertical }
textarea:focus, input:focus, select:focus{ border-color:#6479d0 }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:9px }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px }

button{ border:0; border-radius:12px; min-height:45px; padding:11px 14px; font-weight:750; background:var(--accent); color:#fff }
button.secondary{ background:#252d39; color:#ebf0f7 }
button.ghost{ background:transparent; border:1px solid var(--line); color:#dce3ed }

.status{ min-height:20px; color:var(--muted); font-size:12px; margin-top:10px }
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
canvas{ display:block; width:100%; max-height:400px; object-fit:contain; background:#05070a; border:1px solid var(--line); border-radius:14px; margin-top:10px }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:10px }

.stat b{ display:block; font-size:15px } .stat small{ color:var(--muted); font-size:11px }
.bar{ height:8px; background:#090d13; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-top:11px }
.bar>i{ display:block; height:100%; width:0; background:var(--accent); transition:width .2s }
.note{ color:var(--muted); font-size:12px; margin:9px 0 0 }
.hidden{display:none!important}
.tabs{ display:flex; gap:7px; margin-bottom:15px; background:#0a0e14; border:1px solid var(--line); padding:5px; border-radius:12px }
.tab{ flex:1; background:transparent; color:#9da8b8; min-height:40px; border:0; border-radius:8px; cursor:pointer }
.tab.active{ background:#232b38; color:#fff }
.copyGrid{ display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin-top:12px; max-height:300px; overflow:auto }

.copyCell.bad{ background:#54232b; border-color:#b74f5d; color:#fff }
.copyCell.partial{ background:#554a22; border-color:#b89d3f; color:#fff }
.resultBox{ margin-top:12px; border:1px solid var(--line); border-radius:12px; padding:10px; background:#090d13; max-height:200px; overflow:auto; font-size:12px; white-space:pre-wrap }
.actionGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px }
@media(max-width:760px){ .layout{grid-template-columns:1fr} .wide{grid-column:auto} .stats{grid-template-columns:1fr 1fr} }
</style>

<body>
<div class="app">
<header class="top">
 <div class="brand"><h1>Stegano</h1><p>LSB-стеганография · Fixed Edition</p></div>
 <div class="pill">v8 · No Worker · CSP Safe</div>
</header>

<main class="layout">
<!-- ENCODE -->
<section class="card">
<h2>Скрыть данные</h2>
<div id="drop1" class="drop"><strong>Выберите изображение</strong><span>PNG / JPEG / WebP</span><input id="file1" type="file" accept="image/*"></div>
<div id="sourceInfo" class="fileBox hidden"><div id="sourceName" class="fileName"></div><div id="sourceDetails" class="fileInfo"></div></div>

 <button class="tab active" data-mode="text" type="button">Текст</button>

</div>
<div id="textMode"><label>Сообщение</label><textarea id="secret" placeholder="Введите текст..."></textarea></div>
<div id="fileMode" class="hidden">
 <label>Файл</label>
 <div class="row"><button id="choosePayload" type="button" class="secondary">Выбрать</button><button id="clearPayload" type="button" class="ghost">Убрать</button></div>
 <input id="payloadFile" type="file">

</div>

 <option value="AES-GCM">AES-256-GCM</option>

</select>

<div class="row3" style="margin-top:10px">
 <div><label>Бит</label><select id="bpc"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
 <div><label>Режим</label><select id="distribution"><option value="seq">SEQ</option><option value="prng">PRNG</option></select></div>

<!-- PREVIEW -->

<h2>Предпросмотр</h2>
<canvas id="preview" width="1" height="1"></canvas>
<div class="stats">
 <div class="stat"><b id="sSize">—</b><small>Размер</small></div>
 <div class="stat"><b id="sCap">—</b><small>Ёмкость</small></div>
 <div class="stat"><b id="sPayload">—</b><small>Payload</small></div>
 <div class="stat"><b id="sMethod">—</b><small>Метод</small></div>
</div>
<div class="bar"><i id="bar"></i></div>
</section>
</main>
</div>

<script>
'use strict';

/* =========================================================
   CORE & HELPERS
========================================================= */
const $ = id => document.getElementById(id);
const MAGIC = Uint8Array.from([83,84,71,53]); // "STG5"
const VERSION = 8;
let GRID = 9;
const te = new TextEncoder();
const td = new TextDecoder();

let sourceCanvas = null, encodedCanvas = null, extractCanvas = null;
let currentMode = 'text', filePayload = null;
let lastRecoveredBytes = null, lastRecoveredMetadata = null, lastCfg = null;

// Утилиты
const u32 = n => [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255];
const readU32 = (b,p) => (((b[p]*16777216)>>>0) + (b[p+1]<<16) + (b[p+2]<<8) + b[p+3]) >>> 0;
const concat = (...xs) => { let n=0; for(const x of xs) n+=x.length; const o=new Uint8Array(n); let p=0; for(const x of xs){o.set(x,p); p+=x.length;} return o; };
const equalBytes = (a,b) => a && b && a.length===b.length && a.every((v,i)=>v===b[i]);
const yieldUI = () => new Promise(r => setTimeout(r, 0));

function setStatus(id, msg, type='') {
    const el = $(id);
    if(el) { el.textContent = msg; el.className = 'status ' + type; }
}

/* =========================================================
   CRYPTO (MAIN THREAD - NO WORKER)
========================================================= */
async function sha256(data) {
    return new Uint8Array(await crypto.subtle.digest('SHA-256', data));
}

async function deriveKey(password, salt, algoName) {
    const keyMaterial = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, // Снизили итерации для скорости в демо
        keyMaterial,
        { name: algoName, length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

async function encryptData(data, password, algorithm) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(password, salt, algorithm);
    let iv, cipher;

    if (algorithm === 'AES-CBC') {
        iv = crypto.getRandomValues(new Uint8Array(16));
        cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv }, key, data));
    } else if (algorithm === 'AES-CTR') {
        iv = crypto.getRandomValues(new Uint8Array(16));
        cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CTR", counter: iv, length: 64 }, key, data));
    } else { // AES-GCM default
        iv = crypto.getRandomValues(new Uint8Array(12));
        cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data));
    }
    return { salt, iv, cipher };
}

async function decryptData(cipher, password, salt, iv, algorithm) {
    const key = await deriveKey(password, salt, algorithm);
    if (algorithm === 'AES-CBC') {
        return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, cipher));
    } else if (algorithm === 'AES-CTR') {
        return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CTR", counter: iv, length: 64 }, key, cipher));
    } else {
        return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher));
    }
}

/* =========================================================
   PRNG & SLOTS
========================================================= */
function makeRng(seed) {
    let a = 0x9e3779b9;
    for (const b of seed) a ^= (b + 0x9e3779b9 + (a << 6) + (a >>> 2));
    return () => {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function fisher(n, rng) {
    const a = new Uint32Array(n);
    for (let i = 0; i < n; i++) a[i] = i;
    for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getRegion(c, index) {
    const col = index % GRID, row = Math.floor(index / GRID);
    const x = Math.floor(col * c.width / GRID), y = Math.floor(row * c.height / GRID);
    const x2 = Math.floor((col + 1) * c.width / GRID), y2 = Math.floor((row + 1) * c.height / GRID);
    return { x, y, w: x2 - x, h: y2 - y };
}

function buildSlots(c, bpc, dist, seed, index) {
    const r = getRegion(c, index);
    const channels = r.w * r.h * 3;
    let perm;
    if (dist === 1) {
        const s = concat(seed, Uint8Array.from([index & 255, (index >> 8) & 255]));
        perm = fisher(channels, makeRng(s));
    } else {
        perm = new Uint32Array(channels);
        for (let i = 0; i < channels; i++) perm[i] = i;
    }
    const slots = new Uint32Array(channels * bpc);
    let k = 0;
    for (const ch of perm) for (let bit = 0; bit < bpc; bit++) slots[k++] = ch * bpc + bit;
    return slots;
}

/* =========================================================
   STEGANO LOGIC
========================================================= */
function bytesToBits(bytes) {
    const o = new Uint8Array(bytes.length * 8);
    let k = 0;
    for (const b of bytes) for (let i = 7; i >= 0; i--) o[k++] = (b >> i) & 1;
    return o;
}

function writeRegion(c, packet, bpc, dist, seed, index) {
    const r = getRegion(c, index);
    const ctx = c.getContext('2d');
    const img = ctx.getImageData(r.x, r.y, r.w, r.h);
    const bits = bytesToBits(packet);
    const slots = buildSlots(c, bpc, dist, seed, index);

    if (bits.length > slots.length) throw new Error('Слишком большой данных для области');

    for (let k = 0; k < bits.length; k++) {
        const s = slots[k];
        const bitPos = s % bpc;
        const ch = Math.floor(s / bpc);
        const pixel = Math.floor(ch / 3);
        const channel = ch % 3;
        const di = pixel * 4 + channel;
        const mask = 1 << bitPos;
        img.data[di] = (img.data[di] & ~mask) | (bits[k] << bitPos);
    }
    ctx.putImageData(img, r.x, r.y);
}

function readRegion(c, nBytes, bpc, dist, seed, index) {
    const r = getRegion(c, index);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const img = ctx.getImageData(r.x, r.y, r.w, r.h);
    const slots = buildSlots(c, bpc, dist, seed, index);
    const out = new Uint8Array(nBytes);
    
    for (let k = 0; k < nBytes * 8; k++) {
        const s = slots[k];
        const bitPos = s % bpc;
        const ch = Math.floor(s / bpc);
        const pixel = Math.floor(ch / 3);
        const channel = ch % 3;
        const di = pixel * 4 + channel;
        out[k >> 3] = (out[k >> 3] << 1) | ((img.data[di] >> bitPos) & 1);
    }
    return out;
}

/* =========================================================
   HEADER & PACKING
========================================================= */
function getAlgoByte(name) { return name === 'AES-CBC' ? 1 : name === 'AES-CTR' ? 2 : 0; }
function getAlgoName(byte) { return byte === 1 ? 'AES-CBC' : byte === 2 ? 'AES-CTR' : 'AES-GCM'; }

function buildHeader(flags, bpc, dist, saltLen, ivLen, payloadLen, origLen, hash, algoByte) {
    return concat(
        MAGIC,
        Uint8Array.from([VERSION, flags, bpc, dist, saltLen, ivLen, algoByte]),
        Uint8Array.from(u32(payloadLen)),
        Uint8Array.from(u32(origLen)),
        hash
    );
}

function parseHeader(h) {
    if (h.length < 51 || !equalBytes(h.slice(0, 4), MAGIC)) throw new Error('Bad Magic');
    if (h[4] !== VERSION) throw new Error('Bad Version');
    return {
        flags: h[5], bpc: h[6], dist: h[7], saltLen: h[8], ivLen: h[9],
        algo: getAlgoName(h[10]),
        payloadLen: readU32(h, 11), origLen: readU32(h, 15), hash: h.slice(19, 51)
    };
}

async function getSeed(dist, pass) {
    if (dist === 0) return Uint8Array.from([1, 2, 3, 4]);
    if (!pass) throw new Error('Нужен пароль для PRNG');
    return sha256(concat(te.encode('Stegano-v8|'), te.encode(pass)));
}

/* =========================================================
   ENCODE PROCESS
========================================================= */
$('encode').onclick = async () => {
    if (!sourceCanvas) return setStatus('status1', 'Выберите изображение', 'bad');
    
    try {
        let plain, name, mime;
        if (currentMode === 'text') {
            if (!$('secret').value) return setStatus('status1', 'Введите текст', 'bad');
            plain = te.encode($('secret').value);
            name = 'msg.txt'; mime = 'text/plain';
        } else {
            if (!filePayload) return setStatus('status1', 'Выберите файл', 'bad');
            plain = new Uint8Array(await filePayload.arrayBuffer());
            name = filePayload.name; mime = filePayload.type;
        }

        const encrypted = $('encrypt').checked;
        const password = $('pass').value;
        const algorithm = $('encryptionAlgorithm').value;
        const dist = $('distribution').value === 'prng' ? 1 : 0;
        const bpc = +$('bpc').value;

        if ((encrypted || dist) && !password) return setStatus('status1', 'Нужен пароль', 'bad');

        setStatus('status1', 'Шифрование...');
        const crypted = encrypted ? await encryptData(plain, password, algorithm) : { salt: new Uint8Array(), iv: new Uint8Array(), cipher: plain };

        const meta = te.encode(JSON.stringify({ name, mime, mode: currentMode }));
        const body = concat(Uint8Array.from(u32(meta.length)), meta, crypted.cipher);
        const hash = await sha256(plain);
        
        const header = buildHeader(
            (encrypted ? 1 : 0) | (currentMode === 'file' ? 2 : 0),
            bpc, dist, crypted.salt.length, crypted.iv.length,
            body.length, crypted.cipher.length, hash, getAlgoByte(algorithm)
        );

        const packet = concat(header, body, crypted.salt, crypted.iv);
        const capacity = Math.floor(getRegion(sourceCanvas, 0).w * getRegion(sourceCanvas, 0).h * 3 * bpc / 8);

        if (packet.length > capacity) return setStatus('status1', `Данные слишком велики (${packet.length} > ${capacity})`, 'bad');

        const seed = await getSeed(dist, password);
        encodedCanvas = document.createElement('canvas');
        encodedCanvas.width = sourceCanvas.width;
        encodedCanvas.height = sourceCanvas.height;
        encodedCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0);

        setStatus('status1', 'Запись в пиксели...');
        const copies = GRID * GRID;
        for (let i = 0; i < copies; i++) {
            writeRegion(encodedCanvas, packet, bpc, dist, seed, i);
            if (i % 10 === 0) await yieldUI();
        }

        $('preview').getContext('2d').drawImage(encodedCanvas, 0, 0);
        $('download').disabled = false;
        setStatus('status1', `Готово! ${copies} копий.`, 'ok');
        $('sPayload').textContent = (plain.length / 1024).toFixed(1) + ' KB';

    } catch (e) {
        console.error(e);
        setStatus('status1', 'Ошибка: ' + e.message, 'bad');
    }
};

/* =========================================================
   DECODE PROCESS
========================================================= */
async function decodeOne(c, index, cfg, password) {
    try {
        const rawHeader = readRegion(c, 50, cfg.bpc, cfg.dist, cfg.seed, index);
        const h = parseHeader(rawHeader);
        const totalLen = 50 + h.payloadLen + h.saltLen + h.ivLen;
        
        // Проверка вместимости
        const cap = Math.floor(getRegion(c, index).w * getRegion(c, index).h * 3 * cfg.bpc / 8);
        if (totalLen > cap) return null;

        const packet = readRegion(c, totalLen, cfg.bpc, cfg.dist, cfg.seed, index);
        
        // Парсинг метаданных
        const ml = readU32(packet, 50);
        const meta = JSON.parse(td.decode(packet.slice(54, 54 + ml)));
        
        const rawStart = 54 + ml;
        const rawEnd = 50 + h.payloadLen;
        let plain = packet.slice(rawStart, rawEnd);

        if (h.flags & 1) { // Encrypted
            if (!password) throw new Error('Need Pass');
            const saltStart = 50 + h.payloadLen;
            const salt = packet.slice(saltStart, saltStart + h.saltLen);
            const iv = packet.slice(saltStart + h.saltLen, saltStart + h.saltLen + h.ivLen);
            plain = await decryptData(plain, password, salt, iv, h.algo);
        }

        const valid = equalBytes(await sha256(plain), h.hash);
        return { index, valid, plain, meta, h };
    } catch (e) {
        return null;
    }
}

$('decode').onclick = async () => {
    if (!extractCanvas) return setStatus('status2', 'Выберите изображение', 'bad');
    
    const password = $('pass2').value;
    const useMax = $('maxExtract').checked;
    
    setStatus('status2', 'Поиск конфигурации...');
    $('result').value = '';
    $('diagnostics').classList.add('hidden');
    $('recoveryActions').classList.add('hidden');

    try {
        let recovered = null;
        let cfg = null;

        // 1. Попытка найти конфиг
        const candidates = [];
        for (const bpc of [1, 2, 3]) {
            for (const dist of [0, 1]) {
                if (dist === 1 && !password) continue;
                candidates.push({ bpc, dist, seed: await getSeed(dist, password) });
            }
        }

        for (const c of candidates) {
            for (let i = 0; i < GRID * GRID; i++) {
                try {
                    const hRaw = readRegion(extractCanvas, 50, c.bpc, c.dist, c.seed, i);
                    const h = parseHeader(hRaw);
                    if (h.bpc === c.bpc && h.dist === c.dist) {
                        cfg = { ...c, grid: GRID };
                        break;
                    }
                } catch (e) {}
            }
            if (cfg) break;
        }

        if (!cfg) throw new Error('Стего-данные не найдены или неверный пароль/сетка');

        setStatus('status2', `Найден режим: LSB-${cfg.bpc} ${cfg.dist?'PRNG':'SEQ'}. Чтение копий...`);
        
        const results = [];
        const total = GRID * GRID;
        
        for (let i = 0; i < total; i++) {
            const res = await decodeOne(extractCanvas, i, cfg, password);
            if (res) {
                results.push(res);
                // Визуализация сетки
                const cell = document.createElement('div');
                cell.className = 'copyCell ' + (res.valid ? 'ok' : 'partial');
                cell.textContent = i + 1;
                $('copyGrid').appendChild(cell);
            }
            if (i % 5 === 0) await yieldUI();
        }

        if (results.length === 0) throw new Error('Не удалось прочитать ни одной копии');

        // Приоритет: валидная копия
        const validRes = results.find(r => r.valid);
        if (validRes) {
            recovered = validRes;
        } else if (useMax) {
            // Majority logic (упрощенная для демо - берем первую, если нет валидных, но в реальности нужен побитовый majority)
            // Для надежности просто берем первую найденную, если хеш не сошелся (возможно повреждение)
            recovered = results[0];
            setStatus('status2', 'Целостность нарушена, показываем сырые данные', 'warn');
        } else {
            throw new Error('Нет валидных копий (хеш не совпадает). Попробуйте "Максимальное извлечение"');
        }

        // Вывод
        lastRecoveredBytes = recovered.plain;
        lastRecoveredMetadata = recovered.meta;

        if (recovered.meta.mode === 'text') {
            $('result').value = td.decode(recovered.plain);
        } else {
            $('result').value = `Файл: ${recovered.meta.name}\nРазмер: ${(recovered.plain.length/1024).toFixed(1)} KB`;
            $('recoveryActions').classList.remove('hidden');
        }

        $('diagnostics').classList.remove('hidden');
        $('diagnostics').textContent = `Статус: ${recovered.valid ? 'OK' : 'WARN'}\nКопий: ${results.length}\nАлгоритм: ${recovered.h.algo}`;
        setStatus('status2', recovered.valid ? 'Успешно восстановлено!' : 'Восстановлено с ошибками', recovered.valid ? 'ok' : 'warn');

    } catch (e) {
        console.error(e);
        setStatus('status2', e.message, 'bad');
    }
};

/* =========================================================
   UI WIRING
========================================================= */
function loadCanvas(file) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            res(c);
        };
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
    });
}

function wireDrop(dropId, fileId, cb) {
    const d = $(dropId), f = $(fileId);
    d.onclick = () => f.click();
    f.onchange = () => f.files[0] && cb(f.files[0]);
    d.ondragover = e => { e.preventDefault(); d.classList.add('drag'); };
    d.ondragleave = () => d.classList.remove('drag');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('drag'); e.dataTransfer.files[0] && cb(e.dataTransfer.files[0]); };
}

wireDrop('drop1', 'file1', async f => {
    sourceCanvas = await loadCanvas(f);
    $('sourceName').textContent = f.name;
    $('sourceInfo').classList.remove('hidden');
    $('preview').getContext('2d').drawImage(sourceCanvas, 0, 0);
    $('sSize').textContent = sourceCanvas.width + 'x' + sourceCanvas.height;
    setStatus('status1', 'Загружено: ' + f.name, 'ok');
});

wireDrop('drop2', 'file2', async f => {
    extractCanvas = await loadCanvas(f);
    $('extractName').textContent = f.name;
    $('extractInfo').classList.remove('hidden');
    setStatus('status2', 'Загружено для извлечения', 'ok');
});

$('choosePayload').onclick = () => $('payloadFile').click();
$('payloadFile').onchange = () => { filePayload = $('payloadFile').files[0]; $('payloadFileInfo').textContent = filePayload ? filePayload.name : ''; };
$('clearPayload').onclick = () => { filePayload = null; $('payloadFile').value = ''; $('payloadFileInfo').textContent = ''; };

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentMode = t.dataset.mode;
    $('textMode').classList.toggle('hidden', currentMode !== 'text');
    $('fileMode').classList.toggle('hidden', currentMode !== 'file');
});

$('showPass').onclick = () => { const x=$('pass'); x.type=x.type==='password'?'text':'password'; };
$('gridSize').onchange = () => { GRID = +$('gridSize').value; $('copyGrid').innerHTML=''; $('copyGrid').style.gridTemplateColumns=`repeat(${GRID}, 1fr)`; };

$('download').onclick = () => {
    if (!encodedCanvas) return;
    encodedCanvas.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'stego.png';
        a.click();
    });
};

$('saveExtracted').onclick = () => {
    if (!lastRecoveredBytes) return;
    const b = new Blob([lastRecoveredBytes], { type: lastRecoveredMetadata.mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = lastRecoveredMetadata.name || 'file.bin';
    a.click();
};

$('clear').onclick = () => {
    extractCanvas = null; $('result').value = ''; $('copyGrid').innerHTML = '';
    $('diagnostics').classList.add('hidden'); $('recoveryActions').classList.add('hidden');
    setStatus('status2', '');
};

// Init Grid UI
$('copyGrid').style.gridTemplateColumns = `repeat(${GRID}, 1fr)`;
</script>
